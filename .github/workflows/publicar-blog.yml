name: Publicar artigos agendados do blog
# 15/11: todo dia às 6h (Brasília) roda o gerador do blog; artigo com `publicar` = hoje entra no ar (página, índice e sitemap).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar blog
        run: node blog/gerar.js
      - name: Publicar se mudou
        run: |
          git add -A blog sitemap.xml
          if git diff --cached --quiet; then echo "nada novo hoje"; exit 0; fi
          git config user.name "robo-blog"
          git config user.email "robo-blog@users.noreply.github.com"
          git commit -m "Blog: artigo agendado de $(TZ=America/Sao_Paulo date +%d/%m)"
          git push
